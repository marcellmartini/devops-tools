---
name: build-push-ghcr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/apps/go-web/src/*

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: PR head short SHA
        id: head_sha
        # github.sha, no evento pull_request, é o merge commit sintético
        # (refs/pull/N/merge), não o commit real da PR. Calcula a partir
        # do commit real da PR (8 primeiros chars) pra bater exatamente
        # com {{ .head_sha | trunc 8 }} usado pelo ApplicationSet — os
        # dois truncam o mesmo head_sha, então nunca divergem.
        run: echo "short=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository_owner }}/go-web
          # pr-<numero>: tag "flutuante", conveniente pra debug manual.
          # pr-<numero>-<short-sha>: tag imutável por commit, com o número
          # da PR ainda legível — é essa que o ApplicationSet usa
          # (image.tag: 'pr-{{.number}}-{{ .head_sha | trunc 8 }}'), pra
          # cada push na PR gerar uma tag nova e disparar rollout.
          tags: |
            type=ref,event=pr
            type=raw,value=pr-${{ github.event.number }}-${{ steps.head_sha.outputs.short }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # builda o commit real da PR, não o merge commit sintético do
          # evento pull_request — consistente com a tag acima e com o
          # targetRevision: '{{.head_sha}}' do ApplicationSet.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/apps/go-web/src/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
