---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-environment
  namespace: argocd  # same namespace as argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          # The GitHub organization or user.
          owner: luizhenrique3651
          # The Github repository
          repo: devops-tools
          # For GitHub Enterprise (optional)
          # api: https://git.example.com/
          # Reference to a Secret containing an access token. (optional)
          tokenRef:
            secretName: github-token
            key: token
          # (optional) use a GitHub App to access the API instead of a PAT.
          # appSecretName: github-app-repo-creds
          # Labels is used to filter the PRs that you want to target. (optional)
          labels:
            - preview
        requeueAfterSeconds: 15
  template:
    metadata:
      # branch_slug (não branch) — nomes de branch podem ter "/" (ex.:
      # "feat/teste"), inválido em nomes de recurso Kubernetes.
      name: 'pre-env-{{.branch_slug}}-{{.number}}'
    spec:
      source:
        repoURL: 'https://github.com/luizhenrique3651/devops-tools.git'
        targetRevision: '{{.head_sha}}'
        path: apps/apps/go-web/helm/
        helm:
          parameters:
            # head_sha truncado em 8 (via sprig trunc, disponível com
            # goTemplate: true) — nem head_short_sha (abreviação de
            # tamanho variável do git) nem head_short_sha_7 (fixo em 7)
            # batiam com os 8 primeiros chars que o CI usa (cut -c1-8).
            # Truncar o mesmo head_sha nos dois lados garante que nunca
            # divergem.
            - name: "image.tag"
              value: 'pr-{{.number}}-{{ .head_sha | trunc 8 }}'
            - name: "namespace"
              value: 'pre-env-{{.branch_slug}}-{{.number}}'
      project: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
      destination:
        server: https://kubernetes.default.svc
        namespace: 'pre-env-{{.branch_slug}}-{{.number}}'
